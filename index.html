<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>頭文字入れ替え</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>頭文字入れ替え</h1>
      <p>カタカナをローマ字に直し、名と姓の先頭1文字を交換してカタカナへ戻します。</p>
      <form id="form">
        <label>名前 <input id="name" placeholder="マイケル・ジャクソン" maxlength="120" autocomplete="off" autofocus /></label>
        <button>入れ替える</button>
      </form>
      <output id="result"></output>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
